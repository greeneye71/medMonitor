services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: medmonitor-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: medmonitor-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - MQTT_HOST=mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: medmonitor-frontend
    command: python frontend/app.py
    ports:
      - "8050:8050"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: medmonitor-postgres
    profiles:
      - timescale
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_questa_password}
      POSTGRES_DB: ${POSTGRES_DB:-medmonitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
